}
union DocumentProduction =
  | RecordedDocumentProduction
  | LegacyUnknownDocumentProduction
  | UnavailableDocumentProduction
type HandoffLiteralMetadata {
  type: String
  status: String
  actor: String
  to: String
  respondingTo: String
  refs: [String!]!
  authoredCreatedAt: String
}
type DoltLiteralMetadata {
  type: String!
  status: String!
  actor: String!
  hook: String
  refs: [String!]!
  createdAt: String
  updatedAt: String
  closedAt: String
}
"Whitelisted string-valued labels, preserved literally; not current eligibility or ownership."
type DoltLiteralLabels {
  "Observed labels.queue; no lane-policy inference."
  queueDisposition: String
  "Observed labels.claimed_by_kind."
  claimedByKind: String
  "Observed labels.lease_until; never interpreted as a renewed lease."
  leaseUntil: String
  "Observed labels.expires_at; not a claimability decision."
  expiresAt: String
}
enum RepositoryCoordinateReason {
  missing
  invalid
  conflict
}
type RepositoryCoordinateDiagnostic {
  reason: RepositoryCoordinateReason!
  fieldPath: String!
}
type DoltRecordSummary {
