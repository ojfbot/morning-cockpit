union DoltEvidenceIndex = ObservedDoltIndex | UnavailableDoltIndex
union HandoffEvidenceIndex = ObservedHandoffIndex | UnavailableHandoffIndex
enum ReadyStatus {
  ready
}
enum RefreshStatus {
  refresh_required
}
enum MissingStatus {
  record_not_observed
}
enum InvalidReferenceStatus {
  invalid_reference
}
enum SourceUnavailableStatus {
  source_unavailable
}
type EvidenceIndex {
  status: ReadyStatus!
  snapshotId: String!
  dolt: DoltEvidenceIndex!
  handoff: HandoffEvidenceIndex!
}
type EvidenceRecord {
  status: ReadyStatus!
  snapshotId: String!
  record: ObservedEvidenceRecord!
}
type EvidenceRefreshRequired {
  status: RefreshStatus!
  snapshotId: String!
  reason: String!
}
type EvidenceRecordNotObserved {
  status: MissingStatus!
  snapshotId: String!
  sourceRecordKey: String!
  source: EvidenceSource!
  scope: String!
}
type EvidenceInvalidReference {
  status: InvalidReferenceStatus!
  snapshotId: String!
  sourceRecordKey: String!
  reason: String!
}
type EvidenceSourceUnavailable {
  status: SourceUnavailableStatus!
  snapshotId: String!
  source: EvidenceSource!
  reason: String!
}
union EvidenceIndexResult = EvidenceIndex | EvidenceRefreshRequired
union EvidenceRecordResult =
  | EvidenceRecord
  | EvidenceRefreshRequired
  | EvidenceRecordNotObserved
  | EvidenceInvalidReference
  | EvidenceSourceUnavailable
type AvailableInspectionTarget {
  generatedAt: String!
  expiresAt: String!
  snapshotId: String!
  sourceRecordKey: String!
  sourceRecord: SourceRecord!
}
type UnavailableInspectionTarget {
  reason: String!
}
union InspectionTarget = AvailableInspectionTarget | UnavailableInspectionTarget
"A proposed v1 declaration physically present on the referring resource. Navigation only."
