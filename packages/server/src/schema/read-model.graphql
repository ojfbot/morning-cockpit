"""
Canonical read-model contract — the fleet-wide GraphQL SDL (ADR-0013).

One typed shape for the morning-cockpit human UI and agent readers alike (ADR-0011). Authored here
in core as the authority; the cockpit facade's types are codegen'd from this file (fetched at CI via
git-clone — no runtime import, ADR-0001 extended). Query-only: there is NO Mutation type — the sole
upstream write path stays Handoff Emission (ADR-0005).

Field shapes mirror morning-cockpit `@cockpit/shared` view-models; an SDL<->shared parity test in the
cockpit keeps them from diverging (a deliberate drift breaks CI).
""" # ── Liveness (mirrors fleet.ts `Liveness`, liveness.ts `AgentLivenessState`) ──
enum Liveness {
  LIVE
  STALE
  DARK
}
enum AgentLivenessState {
  LIVE
  IDLE
  DARK
}

# ── Fleet (01) — RepoCard (mirrors fleet.ts `RepoCard`) ──
"""
A per-tile launch link. `links` is forward-declared for Slice L1 (extensible list).
"""
type RepoLink {
  kind: String!
  url: String!
  label: String!
}

"""
Hover/focus popover payload. Contents are deferred to the L3s spike (ADR-0012 #7) — placeholder.
"""
type RepoPopover {
  placeholder: Boolean!
}

type RepoCard {
  name: String!
  role: String!
  phase: String!
  openCount: Int!
  lastActivity: String
  liveness: Liveness!
  here: Boolean
  "Forward-declared (L1) — empty until the tile link set lands."
  links: [RepoLink!]!
  "Forward-declared (L3/L3s) — null until the popover contents spike resolves."
  popover: RepoPopover
}

# ── Derived agent liveness (mirrors liveness.ts `AgentLiveness`, ADR-0008) ──
type AgentLiveness {
  agentId: String!
  state: AgentLivenessState!
  lastEventAt: String!
  lastEventType: String!
}

# ── Briefing (00) — Chief-of-Staff console (mirrors briefing.ts) ──
type BriefingArtifact {
  title: String!
  target: String!
  closes: String!
  align: String!
  task: String!
  criteria: [String!]!
}

type BriefingBranch {
  key: String!
  label: String!
  recommended: Boolean!
  type: String!
  artifact: BriefingArtifact
  cta: String
  outcome: String
  doneText: String
}

type BriefingThread {
  id: String!
  tag: String!
  title: String!
  whyNow: String!
  catchUp: String!
  question: String!
  branches: [BriefingBranch!]!
}

type BriefingSnapshot {
  generatedAt: String!
  "Forward-declared (F2) — the repo this briefing is scoped to; null while global."
  repo: String
  source: String!
  threads: [BriefingThread!]!
}

# ── WorkItem — the unified lane view-model (mirrors work-item.ts `WorkItem`, core fields) ──
type WorkItem {
  id: String!
  nativeId: String!
  sourceRecordKey: String
  sourceRecord: SourceRecord
  source: String!
  kind: String!
  status: String!
  lane: String!
  title: String!
  repo: String
  actor: String
  createdAt: String
  updatedAt: String
  closedAt: String
  activityAt: String!
  staleDays: Int
  posted: Boolean
  claimedBy: String
  claimedByKind: String
  leaseUntil: String
  url: String
}

# ── The read surface (query-only) ──
type Query {
  "Counts and coverage for one captured evidence observation."
  evidenceSummary: EvidenceSummary!
  evidenceIndex(snapshotId: String!): EvidenceIndexResult!
  evidenceRecord(snapshotId: String!, sourceRecordKey: String!): EvidenceRecordResult!
  "Fleet (01) repo cards."
  fleet: [RepoCard!]!
  "Briefing (00). `repo` arg forward-declared for Slice F2 (repo-scoped briefing); null = global."
  briefing(repo: String): BriefingSnapshot!
  "Derived agent liveness (ADR-0008)."
  agentLiveness: [AgentLiveness!]!
  "Lane work-items: overnight | pickup | available."
  workItems(lane: String!): [WorkItem!]!
}

# Existing Dolt/handoff observations only. Production metadata is separate from resource identity.
interface SourceRecord {
  kind: String!
  source: String!
  repository: String
  nativeId: String
  sourcePath: String
}
type DoltBeadSourceRecord implements SourceRecord {
  kind: String!
  source: String!
  repository: String
  nativeId: String!
  sourcePath: String
}
type HandoffDocumentSourceRecord implements SourceRecord {
  kind: String!
  source: String!
  repository: String!
  nativeId: String
  sourcePath: String!
}

enum ReferenceRelation {
  closes
  responding_to
}
enum ClosingRelation {
  closes
}
type MissingTargetDiagnostic {
  reason: String!
  relation: ReferenceRelation!
  targetNativeId: String!
  referrerKey: String!
}
type AmbiguousTargetDiagnostic {
  reason: String!
  relation: ReferenceRelation!
  targetNativeId: String!
  referrerKey: String!
  candidateTargetKeys: [String!]!
}
type SuccessorOrderDiagnostic {
  reason: String!
  relation: ClosingRelation!
  targetNativeId: String
  predecessorKey: String!
  candidateSuccessorKeys: [String!]!
}
"Directed keys, canonically rotated to the least key; never member-sorted."
type RelationCycleDiagnostic {
  reason: String!
  relation: ClosingRelation!
  cycleKeys: [String!]!
}
union UnresolvedRelationDiagnostic =
  | MissingTargetDiagnostic
  | AmbiguousTargetDiagnostic
  | SuccessorOrderDiagnostic
  | RelationCycleDiagnostic

type ProductionInteraction {
  kind: String!
  interactionId: String!
  parentInteractionId: String
  principalId: String
  agentId: String
  runtimeId: String!
  sessionProvider: String
  sessionId: String
  modelProvider: String
  modelId: String
  traceId: String
  hostId: String!
  startedAt: String!
  completedAt: String!
}
"Self-recorded trace, never proof of authenticated authority. See inspector-contract.md; emission enforcement inactive."
type RecordedDocumentProduction {
  status: String!
  schemaVersion: Int!
  interactions: [ProductionInteraction!]!
}
type LegacyUnknownDocumentProduction {
  status: String!
  reason: String!
}
type UnavailableDocumentProduction {
  status: String!
  reason: String!
}
union DocumentProduction =
  | RecordedDocumentProduction
  | LegacyUnknownDocumentProduction
  | UnavailableDocumentProduction

type HandoffLiteralMetadata {
  type: String
  status: String
  actor: String
  to: String
  respondingTo: String
  refs: [String!]!
  authoredCreatedAt: String
}
type HandoffRecordSummary {
  sourceRecordKey: String!
  sourceRecord: SourceRecord!
  title: String!
}
type HandoffRecordEvidence {
  sourceRecordKey: String!
  sourceRecord: SourceRecord!
  title: String!
  literal: HandoffLiteralMetadata!
  observedModifiedAt: String!
  collectedAt: String!
  documentProduction: DocumentProduction!
}
type EvidenceCoverage {
  status: String!
  repositoriesObserved: Int!
  skippedRecords: Int!
  unreadableRepositories: Int!
  reason: String
}
type RepositoryEvidenceCount {
  repository: String!
  count: Int!
}
type EvidenceSummary {
  snapshotId: String!
  generatedAt: String!
  coverage: EvidenceCoverage!
  total: Int!
  byRepository: [RepositoryEvidenceCount!]!
  unresolvedCount: Int!
}
type EvidenceIndex {
  status: String!
  snapshotId: String!
  records: [HandoffRecordSummary!]!
  populationRecordKeys: [String!]!
  unresolvedRelations: [UnresolvedRelationDiagnostic!]!
}
type EvidenceRecord {
  status: String!
  snapshotId: String!
  record: HandoffRecordEvidence!
}
type EvidenceRefreshRequired {
  status: String!
  snapshotId: String!
  reason: String!
}
type EvidenceRecordNotObserved {
  status: String!
  snapshotId: String!
  sourceRecordKey: String!
}
union EvidenceIndexResult = EvidenceIndex | EvidenceRefreshRequired
union EvidenceRecordResult = EvidenceRecord | EvidenceRefreshRequired | EvidenceRecordNotObserved
