    authority: 0.6
    pods: [watch]
    fetch_full_text: false
    verified: 2026-07-28
    note: Renamed from anthropic-cookbook. The new name is the one that resolves.

  - id: gh-skills
    # Commit-level activity, NOT announcements. Authority is deliberately BELOW the
