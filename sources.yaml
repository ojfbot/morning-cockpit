# sources.yaml — the single feed registry for morning-cockpit.
#
# Replaces the hardcoded array that used to live in packages/server/src/config.ts and the
# hand-maintained reading.opml (which had already drifted on titles). See ADR-0015.
#
#   pods:  which surfaces consume this source.
#            reading — the cockpit's Reading pod (/api/reading), rendered in the UI
#            watch   — the Anthropic watch poller (@cockpit/watch), scored and shortlisted
#          A source may belong to both. One entry, no drift.
#
#   tier:  '0' | '1' | '2' — Reading-pod display grouping ONLY. Untouched from the old config.
#   authority: 0..1 — deterministic input to the watch rubric's source_authority dimension.
#          It is NOT model-scored: letting a 7b model rate the authority of its own inputs is
#          a self-grading loop with no ground truth. See ADR-0017.
#
#   verified: the date the endpoint was last fetched and confirmed to return parseable XML.
#          `inherited` = carried over from the shipped config.ts feed list (in production
#          since 2026-06-07) but not individually re-fetched during this build.
#          `pnpm watch:verify-sources` re-checks every entry and reports staleness.
#
# Endpoints that fail verification move to `quarantine:` WITH THE REASON RECORDED.
# Never silently drop one, and never invent a replacement URL.

version: 1

defaults:
  user_agent: "morning-cockpit/0.1 (+local read-model)"
  fetch_timeout_ms: 8000

sources:
  # ---- Anthropic first-party -------------------------------------------------------------
  # No official RSS exists for the marketing-site blogs; these are community mirrors that
  # scrape the same pages. They are single points of failure maintained by volunteers —
  # watch:verify-sources checks their freshness, and a stale mirror is a real risk (the
  # conoro engineering mirror died 2025-11-24 and is deliberately absent below).

  - id: claude-blog
    title: Claude blog
    kind: rss
    feed_url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_claude.xml
    site_url: https://claude.com/blog
    class: anthropic-first-party
    authority: 1.0
    pods: [watch]
    fetch_full_text: true
    verified: 2026-07-28
    note: >-
      The acceptance-test source. Carries the Fable 5 field guides. Feed descriptions are
      title-only (54 bytes for the acceptance item) — full-text fetch is mandatory here.

  - id: anthropic-news
    title: Anthropic news
    kind: rss
    feed_url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
    site_url: https://www.anthropic.com/news
    class: anthropic-first-party
    authority: 1.0
    pods: [watch]
    fetch_full_text: true
    verified: 2026-07-28

