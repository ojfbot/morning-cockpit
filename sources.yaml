# ------------------------------------------------------------------------------------------
# Quarantine — endpoints that were checked and are NOT in service, with the reason recorded.
# A hallucinated feed URL in config is the most expensive failure mode in this build, so a
# failing endpoint is parked here rather than dropped or "fixed" with a guessed replacement.
# ------------------------------------------------------------------------------------------
quarantine:
  - id: anthropic-youtube
    title: Anthropic YouTube
    feed_url: https://www.youtube.com/feeds/videos.xml?channel_id=UCrDwWp7EBBv4NwvScIpBDOA
    site_url: https://www.youtube.com/@anthropic-ai
    checked: 2026-07-28
    reason: >-
      HTTP 404 under both a bot User-Agent and a Chrome User-Agent. The channel_id is CORRECT
      — confirmed against "externalId" in the HTML of youtube.com/@anthropic-ai — so this is
      not an ID error: the videos.xml endpoint does not serve this channel. The upstream
      research doc marked this "VERIFIED" having verified the ID and inferred the feed URL.
      No replacement URL invented. Recheck before assuming YouTube coverage exists.

  - id: hn-claude-code
    title: 'Hacker News: "claude code"'
    feed_url: >-
      https://hn.algolia.com/api/v1/search_by_date?query=%22claude%20code%22&tags=story&numericFilters=points%3E50
    checked: 2026-07-28
    reason: >-
      AVAILABILITY IS FINE — HTTP 200, 360 hits, the API and query syntax both work. This is a
      PRECISION problem: at points>50 the result set is dominated by off-topic stories that
      merely mention Claude Code (top hits included "Bento - an entire PowerPoint in one HTML
      file" and a credential-gateway Show HN). Feeding this to the scorer before the rubric is
      calibrated would spend the 3-item brief budget on noise. Stage 2 decision.

  - id: anthropic-engineering-conoro
    title: Anthropic engineering (conoro mirror)
    feed_url: https://conoro.github.io/anthropic-engineering-rss-feed/anthropic_engineering_rss.xml
    checked: 2026-07-28
    reason: >-
      Known dead — last item 2025-11-24. Recorded here so a future session does not
      rediscover it as a plausible-looking mirror and wire it back in. The live engineering
      mirror is the Olshansk feed above.
