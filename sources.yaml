    title: Claude Code changelog
    kind: rss
    feed_url: https://code.claude.com/docs/en/changelog/rss.xml
    site_url: https://code.claude.com/docs/en/changelog
    class: anthropic-official
    authority: 1.0
    pods: [watch]
    # Release notes are already the full text; fetching the page adds nav, not signal.
    fetch_full_text: false
    verified: 2026-07-28
    note: A real first-party feed, not a mirror. Mintlify-generated.

  - id: anthropic-status
    title: Anthropic status
    kind: rss
    feed_url: https://status.anthropic.com/history.rss
    site_url: https://status.anthropic.com
    class: anthropic-official
    authority: 0.9
    pods: [watch]
    fetch_full_text: false
    verified: 2026-07-28
    note: A real first-party feed (Atlassian Statuspage). Incident bodies are in the feed.

  # ---- Anthropic repositories ------------------------------------------------------------
  - id: gh-claude-code
    # Commit-level activity, NOT announcements. Authority is deliberately BELOW the
    # first-party blogs: an individual commit to a docs/cookbook repo is routine churn, and
    # judged from a bare subject line a model reads almost any imperative commit title as
    # highly actionable. The first live run put "Fix lychee.toml for lychee 0.23" at the top
    # of the brief at 0.88. Release feeds would be the better granularity (Stage 2).
    title: anthropics/claude-code
    kind: atom
    feed_url: https://github.com/anthropics/claude-code/commits/main.atom
    site_url: https://github.com/anthropics/claude-code
    class: anthropic-repo
    authority: 0.6
    pods: [watch]
